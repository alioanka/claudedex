# ⚠️  IMPORTANT: Database Persistence
# - Use: docker-compose up -d --build           (REBUILDS code, KEEPS data ✅)
# - Avoid: docker-compose down -v               (WIPES ALL DATA including admin user & secrets ❌)
#
# 🔐 SECURITY SETUP (run once before first start):
#   1. Create secrets directory: mkdir -p ./secrets && chmod 700 ./secrets
#   2. Create secret files:
#      echo "your_db_user" > ./secrets/db_user
#      echo "your_strong_db_password" > ./secrets/db_password
#      echo "your_strong_redis_password" > ./secrets/redis_password
#   3. Set permissions: chmod 600 ./secrets/*
#   4. Add to .gitignore: echo "secrets/" >> .gitignore
#
# 🏗️  MODULAR ARCHITECTURE:
# - main.py: Orchestrator that manages all trading modules
# - main_dex.py: DEX Trading Module (EVM chains)
# - futures_trading/main_futures.py: Futures Trading Module
# - solana_trading/main_solana.py: Solana Trading Module

services:
  postgres:
    image: timescale/timescaledb:latest-pg14
    container_name: trading-postgres
    restart: unless-stopped
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_DB: tradingbot
      POSTGRES_USER_FILE: /run/secrets/db_user
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_user
      - db_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - trading-network
    healthcheck:
      # -U avoids the FATAL: role "root" log spam (~8.6k lines/day at
      # 10s interval) when pg_isready defaults to the in-container OS
      # user (root). Auth failure didn't break the health check —
      # pg_isready returns OK on connection-refused — but the log
      # noise hid real errors. Reads the same secret the app uses.
      test: ["CMD-SHELL", "pg_isready -U $$(cat /run/secrets/db_user) -d tradingbot"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: trading-redis
    restart: unless-stopped
    command: >
      sh -c "redis-server --appendonly yes --requirepass $$(cat /run/secrets/redis_password)"
    secrets:
      - redis_password
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - trading-network
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"

  trading-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trading-bot
    restart: "no"
    # Resource ceiling — even if a Python subprocess leaks badly, the
    # kernel OOM-killer reaps the container instead of taking the
    # whole VPS down.
    # Wave-F5 RC-D2: 4g sized for the old SNIPER+ARBITRAGE workload; 28 modules incl. two ~1GB TF processes (DEX+Advisor) got cgroup-OOM-killed together twice at 4g.
    mem_limit: 6g
    memswap_limit: 6g
    cpus: 3.0
    ports:
      # ⚠️ SECURITY (Wave-F6): this publishes the DASHBOARD CONTROL PLANE —
      # trade execution, settings, module control, RPC/credential management —
      # on 0.0.0.0:8080 of the host, i.e. the public internet on a VPS.
      # The ops sweep recorded live attacks against it (Mirai RCE probes,
      # /api/.env fishing, credential-stuffing logins). Auth + CSRF + RBAC
      # held, but password auth on plain HTTP is NOT an acceptable long-term
      # posture for a trading bot. Operators SHOULD either:
      #   1. firewall 8080 to operator IPs (ufw allow from <ip> to any port 8080),
      #   2. bind it privately ("127.0.0.1:8080:8080") and reach it via
      #      SSH tunnel / VPN (wireguard), or
      #   3. put a TLS-terminating reverse proxy (nginx/caddy) in front and
      #      set DASHBOARD_HTTPS accordingly (see .env.example).
      # The binding is left public here ONLY so the operator keeps access
      # while migrating; treat firewalling as a required deployment step.
      - "8080:8080"
    environment:
      # Non-sensitive configuration
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: tradingbot
      LOG_LEVEL: INFO
      PYTHONUNBUFFERED: "1"
      # Module Enable/Disable Flags
      DEX_MODULE_ENABLED: ${DEX_MODULE_ENABLED:-true}
      FUTURES_MODULE_ENABLED: ${FUTURES_MODULE_ENABLED:-false}
      SOLANA_MODULE_ENABLED: ${SOLANA_MODULE_ENABLED:-false}
    secrets:
      - db_user
      - db_password
      - redis_password
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./config:/app/config
      - ./models:/app/models
      - ./.encryption_key:/app/.encryption_key:ro
      # Mounting .env as a volume overrides the version baked into the
      # image at build time. Edit .env on host then either:
      #   - `docker compose restart trading-bot` (re-runs Python with new env)
      #   - `docker compose down && docker compose up -d` (clean recycle)
      # NOT required: rebuild (`--build`). Only needed for Python code changes.
      - ./.env:/app/.env:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - trading-network
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"

# Docker secrets - stored in files, not in git
secrets:
  db_user:
    file: ./secrets/db_user
  db_password:
    file: ./secrets/db_password
  redis_password:
    file: ./secrets/redis_password

volumes:
  postgres-data:
  redis-data:

networks:
  trading-network:
    driver: bridge